<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubble — Token Launcher</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Patrick+Hand+SC&display=swap" rel="stylesheet">
<style>:root{--bg:#f6a800;--panel:#fffdf6;--ink:#111;--mute:#5a4300;--line:#111;--up:#0a7a3d;--down:#c4161c;--btn:#111;--btnink:#fff;--sh:4px 4px 0 #111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Patrick Hand",system-ui,sans-serif;font-size:18px;line-height:1.35;background-color:var(--bg);background-image:linear-gradient(rgba(0,0,0,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.09) 1px,transparent 1px);background-size:26px 26px}
.mono{font-family:"Patrick Hand",system-ui,sans-serif;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #111;outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;border-bottom:3px solid #111;position:sticky;top:env(safe-area-inset-top,0px);background:var(--panel);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-family:"Patrick Hand SC",sans-serif;font-size:34px;line-height:1}
nav{display:flex;gap:22px;align-items:center}
nav a,nav button.lnk{background:none;border:0;padding:0;color:#111;text-decoration:none;font-size:20px}
nav .on{text-decoration:underline wavy;text-underline-offset:6px}
.btn{background:var(--btn);color:var(--btnink);border:2.5px solid #111;border-radius:999px;padding:7px 20px;font-size:19px;box-shadow:3px 3px 0 rgba(0,0,0,.35);transition:transform .1s}
.btn:hover{transform:translate(-1px,-1px)}.btn.ghost{background:#fff;color:#111}.btn:disabled{opacity:.45;cursor:default}
main{max-width:1240px;margin:0 auto;padding:24px}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:36px;align-items:center;background:var(--panel);border:3px solid #111;border-radius:30px;box-shadow:var(--sh);padding:28px 40px}
.hero h1{margin:0;font-family:"Patrick Hand SC",sans-serif;font-weight:400;font-size:clamp(48px,9vw,112px);line-height:.95;letter-spacing:.01em}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;color:var(--mute)}.hero .meta b{color:#111;font-weight:400}
.ca{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mute);flex-wrap:wrap}
.ca code{word-break:break-all;font-family:ui-monospace,monospace;font-size:13px;color:#111}
.ca button{border:2px solid #111;background:#fff;border-radius:8px;padding:1px 10px;font-size:15px}
.up{color:var(--up)}.down{color:var(--down)}
/* speech bubbles */
.sb{position:relative;display:block;width:var(--s);height:var(--s);flex:none;transition:transform .2s}
.sb svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.22))}
.sb svg .o{fill:#fff;stroke:#111;stroke-width:3.4;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.sb.black svg .o{fill:#111}
.sc{position:absolute;top:10%;bottom:24%;left:8%;right:8%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*.025);text-align:center;color:#111;line-height:1}
.sb.burst .sc{inset:20%}.sb.black .sc{color:#fff}
.sc b{font-family:"Patrick Hand SC",sans-serif;font-weight:400;font-size:max(12px,calc(var(--s)*.15));letter-spacing:.02em}
.sc i{font-style:normal;font-size:max(11px,calc(var(--s)*.085))}
.sb.black .up{color:#6ee7a0}.sb.black .down{color:#ff8f8f}
.gp{display:block;width:62%;height:max(6px,calc(var(--s)*.045));border:2px solid currentColor;border-radius:99px;overflow:hidden}
.gp u{display:block;height:100%;background:#f6a800}
.av{position:relative;overflow:hidden;border-radius:50%;border:2.5px solid #111;background:#f6a800;display:grid;place-items:center;width:calc(var(--s)*.3);height:calc(var(--s)*.3);font-family:"Patrick Hand SC",sans-serif;font-size:calc(var(--s)*.16);color:#111;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sb.black .av{border-color:#fff}
.sb.icon .av{width:calc(var(--s)*.55);height:calc(var(--s)*.55);font-size:calc(var(--s)*.28)}
.sb.sm:not(.icon):not(.bar) .av{display:none}.sb.xs .gp,.sb.xs .sc i{display:none}
.hero .sb{animation:bob 6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px) rotate(-2deg)}}
.sec{display:inline-block;margin:32px 0 12px;background:#fff;border:2.5px solid #111;border-radius:999px;padding:1px 16px;font-family:"Patrick Hand SC",sans-serif;font-size:20px}
.top{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.chip{display:flex;align-items:center;gap:12px;background:var(--panel);border:2.5px solid #111;border-radius:18px;box-shadow:3px 3px 0 #111;padding:10px 14px;text-align:left;width:100%}
.chip .t{flex:1;min-width:0}.chip .t b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip .t span{font-size:15px;color:var(--mute)}
.bar{display:flex;justify-content:space-between;align-items:end;border-bottom:3px solid #111;margin-top:36px;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:22px}
.tabs button{background:none;border:0;border-bottom:4px solid transparent;padding:8px 0;color:#4a3600;font-family:"Patrick Hand SC",sans-serif;font-size:25px}
.tabs button[aria-selected="true"]{color:#111;border-color:#111}
.seg{display:flex;border:2.5px solid #111;border-radius:999px;padding:2px;margin-bottom:8px;background:#fff}
.seg button{border:0;background:none;border-radius:999px;padding:3px 16px;font-size:18px}.seg button[aria-pressed="true"]{background:#111;color:#fff}
#field{position:relative;margin-top:12px;height:620px;overflow:hidden}
.fb{position:absolute;z-index:1;animation:drift var(--d,7s) ease-in-out var(--dl,0s) infinite alternate;transition:left .6s,top .6s}
.fb:hover .sb{transform:rotate(-3deg) scale(1.07)}
.dd{position:absolute;pointer-events:none;font-size:24px;opacity:.85}
@keyframes drift{from{transform:translate(-6px,-8px)}to{transform:translate(6px,9px)}}
.hint{font-size:16px;margin:8px 4px 0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px;margin-top:16px}
.card{background:var(--panel);border:2.5px solid #111;border-radius:20px;box-shadow:3px 3px 0 #111;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.card .sb{margin:4px auto 6px}.card small{color:var(--mute);font-size:15px}.card b{font-weight:400;font-size:20px}
.card .row{display:flex;justify-content:space-between;font-size:16px}.card .d{font-size:15px;color:var(--mute);border:2px dashed #111;border-radius:10px;padding:5px 8px;min-height:44px}
.empty{margin-top:16px;padding:48px 20px;text-align:center;background:var(--panel);border:2.5px dashed #111;border-radius:22px}
dialog{border:3px solid #111;border-radius:26px;background:var(--panel);color:#111;padding:0;width:min(460px,92vw);max-height:90vh;box-shadow:6px 6px 0 #111}
dialog::backdrop{background:rgba(40,25,0,.55)}dialog a{color:#111}
.mb{padding:24px;display:flex;flex-direction:column;gap:12px}.mb .sb{margin:0 auto}
.mb h2{margin:0;text-align:center;font-family:"Patrick Hand SC",sans-serif;font-weight:400;font-size:34px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats div{background:#ffeaa8;border:2px solid #111;border-radius:12px;padding:8px 12px;font-size:15px;color:var(--mute)}.stats b{display:block;color:#111;font-weight:400;font-size:20px}
.pbar{height:14px;border:2.5px solid #111;border-radius:99px;background:#fff;overflow:hidden}.pbar i{display:block;height:100%;background:#f6a800}
label{font-size:16px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
input,textarea,select{font:inherit;color:#111;background:#fff;border:2.5px solid #111;border-radius:12px;padding:7px 12px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.q{font-size:16px;color:var(--mute);min-height:20px}
.acts{display:flex;gap:10px}.acts .btn{flex:1}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:2px solid #111;border-radius:14px;padding:8px 12px}.frow small{display:block;color:var(--mute);font-size:14px}.frow .btn{padding:3px 16px;font-size:16px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#111;color:#fff;padding:9px 20px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:860px){header{padding:10px 16px}nav .hide{display:none}main{padding:16px}.hero{grid-template-columns:1fr;padding:22px;gap:18px;justify-items:start}.top{grid-template-columns:1fr 1fr}#field{height:660px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#field .sb svg{filter:none}.fb{contain:layout style}.more{display:block;margin:18px auto 0}
.feat{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:3px solid #111;border-radius:22px;box-shadow:var(--sh);padding:10px 18px;margin-bottom:16px}.feat b{font-family:"Patrick Hand SC",sans-serif;font-weight:400;font-size:28px}.feat code{word-break:break-all;font-family:ui-monospace,monospace;font-size:13px}.feat button[data-copy]{border:2px solid #111;background:#fff;border-radius:8px;padding:1px 10px;font-size:15px}.feat .btn{margin-left:auto;padding:4px 18px}
</style>
</head>
<body>
<header>
 <div class="logo"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="13" cy="21" r="11" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="25" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="9" cy="17" r="2.2" fill="currentColor"/></svg>bubble</div>
 <nav>
  <button class="lnk hide" id="nNew">New coin</button>
  <button class="lnk hide" id="nFees" style="display:none">Creator fees</button>
  <a class="on hide" href="#launches">Launches</a>
  
  <button class="btn" id="wallet">Connect wallet</button>
 </nav>
</header>
<main>
 <div id="feat"></div>
 <section class="hero" id="hero"></section>
 <div class="sec mono">Top by market cap</div>
 <div class="top" id="top"></div>
 <div class="bar" id="launches">
  <div class="tabs" role="tablist">
   <button role="tab" aria-selected="true" data-t="new">New</button>
   <button role="tab" aria-selected="false" data-t="trending">Trending</button>
   <button role="tab" aria-selected="false" data-t="graduated">Graduated</button>
  </div>
  <div class="seg"><button data-v="field" aria-pressed="true">Bubbles</button><button data-v="grid" aria-pressed="false">Grid</button></div>
 </div>
 <div id="stage"></div>
 <p class="hint" id="hint">Bubble size = market cap relative to the graduation target. A full ring = graduated. Data is read straight from Robinhood Chain (Pons v2).</p>
</main>

<dialog id="dlg"><div class="mb" id="dbody"></div></dialog>
<div id="toast" role="status"></div>

<script type="module">
import {createPublicClient,createWalletClient,custom,http,parseAbi,parseEther,parseUnits,formatUnits,formatEther,toHex,zeroAddress,encodeAbiParameters,keccak256,parseEventLogs} from "https://esm.sh/viem@2";
const START_BLOCK=0n; // set to the Pons factory deploy block (e.g. 80000000n) to make the first load much faster
const ONLY_BUBBLE=true; // true = show only tokens whose fee recipient is the Bubble treasury; false = every Pons token
const HIDDEN=[]; // paste token addresses (0x…) of test launches to hide them from this site
const HID=new Set(HIDDEN.map(a=>a.toLowerCase())),vis=()=>TK.filter(t=>!HID.has(t.addr.toLowerCase())&&(!ONLY_BUBBLE||(t.cfr||"").toLowerCase()===TREASURY));
const FEATURED=""; // paste the $BUBBLE contract address (0x…) here: the hero always shows $BUBBLE, with this CA
const PH={addr:zeroAddress,sym:"BUBBLE",name:"Bubble",logo:"",ch:null,gr:0,mc:0,pi:{sym:"ETH"}}; // placeholder bubble until $BUBBLE exists on chain
const RPC="https://rpc.mainnet.chain.robinhood.com",EX="https://robinhoodchain.blockscout.com";
const TREASURY="0xe734af2cB242700fc117CBe94b09acE4F91Bd1f4".toLowerCase();
const A={factory:"0x7eD598BcEf8bd9Edd8C97A195C6d13f40801EC7e",router:"0xe33E9E479dF8802cb0866d5d05258bEc4cF62948",escrow:"0xd3AFEB2a57f70eF218Aa82451c51B2fb0416Ac9e",hook:"0xE5e702641Ea86F4ae6cC3cDaeD2B886f976Be044"};
const chain={id:4663,name:"Robinhood Chain",nativeCurrency:{name:"Ether",symbol:"ETH",decimals:18},rpcUrls:{default:{http:[RPC]}},blockExplorers:{default:{name:"Blockscout",url:EX}}};
const S="struct Socials { string twitter; string telegram; string discord; string website; string farcaster; }";
const TP="struct TokenParams { string name; string symbol; string logo; string description; Socials socials; address creatorFeeRecipient; uint16 creatorTaxBps; bool buybackEnabled; bytes32 expectedEconomics; bytes32 salt; }";
const F=parseAbi([S,TP,
"struct LaunchConfig { uint256 supply; uint256 curveFeeBps; uint256 phantomQuote; uint256 graduationThreshold; uint24 poolFee; int24 tickSpacing; bool enabled; }",
"struct LaunchedToken { address token; address curve; address deployer; address creatorFeeRecipient; address pairToken; uint256 graduationThreshold; uint24 poolFee; int24 tickSpacing; uint16 creatorTaxBps; bool buybackEnabled; uint8 phase; uint256 sweptQuote; uint256 sweptTokens; uint256 sweptAt; bool exists; }",
"function launchToken(TokenParams params, uint256 launchConfigId, address pairToken) payable returns (address token, address curve)",
"function previewLaunchEconomics(uint256 launchConfigId, address pairToken) view returns (bytes32)",
"function launchFee() view returns (uint256)","function launchConfigCount() view returns (uint256)",
"function getLaunchConfig(uint256 id) view returns (LaunchConfig)","function getLaunchedToken(address token) view returns (LaunchedToken)",
"function canLaunch(address) view returns (bool)","function maxCreatorTaxBps() view returns (uint256)",
"function pairTokenEconomics(address pairToken) view returns (uint256 phantomQuote, uint256 graduationThreshold, uint8 decimals)",
"event TokenLaunched(address indexed token, address indexed curve, address indexed deployer, address pairToken, uint256 launchConfigId, uint256 graduationThreshold)"]);
const R=parseAbi([S,TP,"function launchAndBuy(TokenParams params, uint256 launchConfigId, address pairToken, uint256 quoteIn, uint256 minTokensOut, address recipient, address[] snipeTaxExemptions) payable returns (address token, address curve, uint256 tokensOut)"]);
const C=parseAbi(["function getReserves() view returns (uint256 quoteReserve, uint256 tokenReserve)","function realQuoteReserve() view returns (uint256)","function sellableTokens() view returns (uint256)","function feeBps() view returns (uint256)","function creatorTaxBps() view returns (uint256)","function currentSnipeTaxBps(address recipient) view returns (uint256)","function buy(uint256 quoteIn, uint256 minTokensOut, address recipient) payable returns (uint256)","function sell(uint256 tokensIn, uint256 minQuoteOut, address recipient) returns (uint256)"]);
const K=parseAbi([S,"function name() view returns (string)","function symbol() view returns (string)","function totalSupply() view returns (uint256)","function allowance(address,address) view returns (uint256)","function approve(address,uint256) returns (bool)","function getTokenInfo() view returns (address tokenDeployer, string tokenLogo, string tokenDescription, Socials tokenSocials)"]);
const C2=parseAbi(["function quoteFeeBalance() view returns (uint256)","function creatorTaxBalance() view returns (uint256)","function sweepFees(uint256 minBuybackTokensOut)"]);
const H=parseAbi(["function pendingFees(bytes32 poolId, address currency) view returns (uint256)","function pendingCreatorTax(bytes32 poolId, address currency) view returns (uint256)","function sweepPoolFees(bytes32 poolId, uint256 minConversionQuoteOut, uint256 minBuybackTokensOut)"]);
const E=parseAbi(["function balanceOf(address recipient) view returns (uint256)","function balanceOfToken(address recipient, address token) view returns (uint256)","function claim()","function claimToken(address token)"]);
const EV=F.find(x=>x.name==="TokenLaunched");
const pub=createPublicClient({chain,transport:http(RPC)});
const wait=ms=>new Promise(r=>setTimeout(r,ms)),isNet=e=>/HTTP request failed|fetch|429|rate|timeout/i.test(e.shortMessage||e.message||"");
const rd=async(address,abi,functionName,args=[],t=0)=>{try{return await pub.readContract({address,abi,functionName,args})}catch(e){if(t<2&&isNet(e)){await wait(500*(t+1));return rd(address,abi,functionName,args,t+1)}throw e}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmN=n=>!isFinite(n)?"–":n>=1e3?(n/1e3).toFixed(1)+"K":n>=1?n.toFixed(2):n>=.001?n.toPrecision(2):n===0?"0":n.toExponential(1);
const pc=n=>n==null?"":(n>0?"+":"")+n.toLocaleString("en",{maximumFractionDigits:1})+"%";
const cls=n=>n==null||n>=0?"up":"down",short=a=>a.slice(0,6)+"…"+a.slice(-4),hue=a=>parseInt(a.slice(2,6),16)%360;
const safe=u=>{u=(u||"").trim();return u.startsWith("ipfs://")?"https://ipfs.io/ipfs/"+u.slice(7).replace(/^ipfs\//,""):/^https:\/\//.test(u)||/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(u)?u:""};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove("show"),3200)}
let TK=[],tab="new",view="field",acct=null,wc=null,loading=true,err="",cur=null,mode="buy",amt="",slip="1",qt,PAIR={},lim=60,OPS=[],CH=0n;
/* ---------- data ---------- */
const lim8=(()=>{let n=0;const q=[],nx=()=>{if(n<3&&q.length){n++;const [f,ok,no]=q.shift();f().then(ok,no).finally(()=>{n--;nx()})}};return f=>new Promise((ok,no)=>{q.push([f,ok,no]);nx()})})();
let LC=0;
async function logs(from,to,d=0,t=0){if(++LC>800)throw new Error("Too many log requests. Set START_BLOCK in the script.");
 try{return await lim8(()=>pub.getLogs({address:A.factory,event:EV,fromBlock:from,toBlock:to}))}
 catch(e){if(isNet(e)&&t<3){await wait(800*(t+1));return logs(from,to,d,t+1)}
  if(d>16||to<=from)throw e;const m=(from+to)/2n;return (await Promise.all([logs(from,m,d+1),logs(m+1n,to,d+1)])).flat()}}
async function pairInfo(a){if(PAIR[a])return PAIR[a];const [ph,,dec]=await rd(A.factory,F,"pairTokenEconomics",[a]).catch(()=>[0n,0n,18]);const sym=a===zeroAddress?"ETH":await rd(a,K,"symbol").catch(()=>"?");return PAIR[a]={phantom:ph,dec:a===zeroAddress?18:(Number(dec)||18),sym}}
async function live(o){
 try{const [r,real,rec]=await Promise.all([rd(o.curve,C,"getReserves"),rd(o.curve,C,"realQuoteReserve"),rd(A.factory,F,"getLaunchedToken",[o.addr])]);o.phase=rec.phase;o.cfr=rec.creatorFeeRecipient;o.qR=r[0];o.tR=r[1];o.real=real}catch(e){}
 if(o.qR!==undefined&&o.tR>0n){const p=Number(o.qR)/Number(o.tR);o.mc=p*Number(o.supply)/10**o.pi.dec;o.mcRel=Math.max(.01,p*Number(o.supply)/Number(o.thr));o.ch=(o.ph||o.pi.phantom)>0n?(p/(Number(o.ph||o.pi.phantom)/Number(o.supply))-1)*100:null}
 else{o.mc=0;o.mcRel=o.phase>=2?1.5:.01;o.ch=null}
 o.gr=o.phase>=2?100:Math.min(100,Number(o.real||0n)/Number(o.thr)*100)}
async function build(l){const g=l.args,t=g.token;
 const [name,sym,supply,info,rec,pi]=await Promise.all([rd(t,K,"name"),rd(t,K,"symbol"),rd(t,K,"totalSupply"),rd(t,K,"getTokenInfo").catch(()=>null),rd(A.factory,F,"getLaunchedToken",[t]),pairInfo(g.pairToken)]);
 const cfg=pi.phantom>0n?null:await rd(A.factory,F,"getLaunchConfig",[g.launchConfigId]).catch(()=>null),o={addr:t,ph:cfg?cfg.phantomQuote:pi.phantom,curve:g.curve,pair:g.pairToken,thr:g.graduationThreshold,name,sym,supply,logo:safe(info?.[1]),desc:info?.[2]||"",soc:info?.[3]||{},by:g.deployer,pi,h:hue(t),phase:rec.phase,cfr:rec.creatorFeeRecipient,pf:rec.poolFee,ts:rec.tickSpacing,blk:Number(l.blockNumber)*1e4+Number(l.logIndex)};
 await live(o);return o}
const CK="bubble:cache:v3",jr=(k,x)=>typeof x==="bigint"?"__b"+x:x,jv=(k,x)=>typeof x==="string"&&x.startsWith("__b")?BigInt(x.slice(3)):x;
const ldC=()=>{try{return JSON.parse(localStorage.getItem(CK),jv)}catch(e){return null}};
const svC=h=>{try{localStorage.setItem(CK,JSON.stringify({head:String(h),items:TK},jr))}catch(e){}};
async function findStart(head){try{let lo=0n,hi=head;const has=async n=>{const c=await pub.getCode({address:A.factory,blockNumber:n});return !!c&&c!=="0x"};if(!await has(hi))return 0n;
 while(lo<hi){const m=(lo+hi)/2n;if(await has(m))hi=m;else lo=m+1n}return lo>1000n?lo-1000n:0n}catch(e){return 0n}}
async function refresh(l){for(let i=0;i<l.length;i+=8)await Promise.all(l.slice(i,i+8).map(live))}
async function load(){err="";LC=0;const c=ldC(),cached=!!(c&&Array.isArray(c.items)&&c.items.length);CH=cached&&c.head?BigInt(c.head):0n;

const BPS=10000n,ceilDiv=(a,b)=>(a+b-1n)/b,aOut=(i,ri,ro)=>(i*ro)/(ri+i),aIn=(o,ri,ro)=>(o*ri)/(ro-o)+1n;
async function quoteBuy(t,quoteIn){
 const [res,sellable,feeBps,tax,raw]=await Promise.all([rd(t.curve,C,"getReserves"),rd(t.curve,C,"sellableTokens"),rd(t.curve,C,"feeBps"),rd(t.curve,C,"creatorTaxBps"),rd(t.curve,C,"currentSnipeTaxBps",[acct||zeroAddress])]);
 const [qR,tR]=res;let sn=raw;if(sn>0n){const mx=BPS-feeBps-tax-100n;if(sn>mx)sn=mx}
 let spent=quoteIn,out=aOut(spent-(spent*feeBps)/BPS-(spent*tax)/BPS-(spent*sn)/BPS,qR,tR);
 if(out>sellable){out=sellable;const g=ceilDiv(aIn(sellable,qR,tR)*BPS,BPS-feeBps-tax-sn);spent=g<quoteIn?g:quoteIn}
 return {tokensOut:out,spent,refund:quoteIn-spent}}
async function quoteSell(t,tokensIn){
 const [res,feeBps,tax]=await Promise.all([rd(t.curve,C,"getReserves"),rd(t.curve,C,"feeBps"),rd(t.curve,C,"creatorTaxBps")]);
 const g=aOut(tokensIn,res[1],res[0]);return g-(g*feeBps)/BPS-(g*tax)/BPS}

function pack(items,W,H){
 const mx=Math.max(...items.map(t=>t.mcRel)),R=Math.min(W,H)<520?.7:1;
 const r=items.map(t=>(36+Math.sqrt(t.mcRel/mx)*58)*R);
 const p=items.map((_,i)=>({x:W/2+Math.cos(i*2.4)*i*(W/40),y:H/2+Math.sin(i*2.4)*i*(H/50)}));
 for(let k=0,IT=items.length>40?120:220;k<IT;k++){
  for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){
   let dx=p[j].x-p[i].x,dy=p[j].y-p[i].y,d=Math.hypot(dx,dy)||1,m=r[i]+r[j]+8;
   if(d<m){const f=(m-d)/2/d;p[i].x-=dx*f;p[i].y-=dy*f;p[j].x+=dx*f;p[j].y+=dy*f}}
  p.forEach((q,i)=>{q.x+=(W/2-q.x)*.004;q.y+=(H/2-q.y)*.006;q.x=Math.max(r[i]+8,Math.min(W-r[i]-8,q.x));q.y=Math.max(r[i]+8,Math.min(H-r[i]-8,q.y))})}
 return p.map((q,i)=>({x:q.x-r[i],y:q.y-r[i],d:r[i]*2}));
}

async function claim(a){try{await ensureChain();await done(await wc.writeContract(a===zeroAddress?{address:A.escrow,abi:E,functionName:"claim"}:{address:A.escrow,abi:E,functionName:"claimToken",args:[a]}));toast("Claimed ✓");drawFees()}catch(e){toast((e.shortMessage||e.message||"Failed").slice(0,140))}}
async function sweep(a){const t=TK.find(x=>x.addr===a);try{await ensureChain();await done(await wc.writeContract(t.phase===0?{address:t.curve,abi:C2,functionName:"sweepFees",args:[0n]}:{address:A.hook,abi:H,functionName:"sweepPoolFees",args:[poolId(t),0n,0n]}));toast("Swept ✓ fees moved to escrow");drawFees()}
 catch(e){const m=(e.shortMessage||e.message||"")+JSON.stringify(e.cause?.data||"");toast(/InternalSwapRequiresOperator/.test(m)?"This sweep needs the Pons operator (buyback or conversion). It runs automatically.":(e.shortMessage||e.message||"Failed").slice(0,140))}}
/* ---------- events ---------- */
document.addEventListener("click",e=>{const x=e.target,b=x.closest("[data-open],[data-copy],[data-close],[data-t],[data-v],[data-m],[data-retry],[data-claim],[data-sweep],[data-more]");
 if(x.id==="go")return launch();if(x.id==="act")return trade();if(x.id==="heroNew")return openNew();if(!b)return;
 const d=b.dataset;if(d.more!==undefined){lim+=60;render();return}if(d.claim){claim(d.claim);return}if(d.sweep){sweep(d.sweep);return}if(d.open)openTk(d.open);else if(d.copy){try{navigator.clipboard.writeText(d.copy)}catch(_){}toast("Address copied")}
 else if(b.hasAttribute("data-close"))$("#dlg").close();else if(d.m){mode=d.m;amt="";drawTk()}else if(d.retry!==undefined)load();
 else if(d.t){tab=d.t;$$(".tabs button").forEach(y=>y.setAttribute("aria-selected",y===b));render()}
 else if(d.v){view=d.v;$$(".seg button[data-v]").forEach(y=>y.setAttribute("aria-pressed",y===b));render()}});
document.addEventListener("input",e=>{if(e.target.id==="amt"){amt=e.target.value;clearTimeout(qt);qt=setTimeout(quote,350)}if(e.target.id==="slp")slip=e.target.value});
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close()});
$("#nNew").onclick=openNew;$("#nFees").onclick=openFees;
$("#wallet").onclick=()=>{if(acct){setAcct(null);toast("Wallet disconnected")}else connect()};
if(window.ethereum){window.ethereum.on?.("accountsChanged",a=>{if(acct)setAcct(a&&a[0]||null)});
 try{if(localStorage.getItem("bubble:w"))window.ethereum.request({method:"eth_accounts"}).then(a=>{if(a&&a[0]&&!acct)setAcct(a[0])}).catch(()=>{})}catch(e){}}
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>view==="field"&&TK.length&&render(),250)});
setInterval(async()=>{if(document.hidden||!TK.length)return;await refresh(TK.filter(t=>t.phase<2).slice(0,12));if(!$("#dlg").open)render()},30000);
load();
try{pub.watchEvent({address:A.factory,event:EV,pollingInterval:5000,onError:()=>{},onLogs:async ls=>{let add=false;for(const l of ls){const t=l.args&&l.args.token;if(t&&!TK.some(x=>x.addr===t)){try{const o=await build(l);if(!TK.some(x=>x.addr===o.addr)){TK.unshift(o);add=true;toast("New token $"+o.sym)}}catch(e){}}}
 if(add){TK.sort((a,b)=>b.blk-a.blk);svC(CH);if(!$("#dlg").open)render()}}})}catch(e){}
</script>
